<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="430" viewBox="0 0 1120 430" role="img" aria-labelledby="title desc">
  <title id="title">보이는 모양, 강체, 충돌 모양의 차이</title>
  <desc id="desc">물리 속성이 없는 큐브는 떠 있고, 강체만 있는 큐브는 바닥을 통과하며, 강체와 충돌 모양이 있는 큐브는 바닥 위에 멈춘다. 실제 화면이 아닌 개념도이다.</desc>
  <rect width="1120" height="430" rx="18" fill="#111b2c"/>
  <g font-family="sans-serif" fill="#edf3ff">
    <text x="32" y="43" font-size="23" font-weight="bold">같은 큐브, 다른 물리 설정</text>
    <text x="1085" y="42" text-anchor="end" font-size="14" fill="#aebed6">개념도 · 실제 UI 캡처 아님</text>
    <g fill="#1e2d43"><rect x="24" y="65" width="344" height="330" rx="12"/><rect x="388" y="65" width="344" height="330" rx="12"/><rect x="752" y="65" width="344" height="330" rx="12"/></g>
    <g font-size="21" font-weight="bold"><text x="48" y="104">① 물리 설정 없음</text><text x="412" y="104">② Rigid Body만</text><text x="776" y="104">③ Rigid Body + Collider</text></g>
    <g fill="#63758c"><rect x="48" y="280" width="296" height="12"/><rect x="412" y="280" width="296" height="12"/><rect x="776" y="280" width="296" height="12"/></g>
    <rect x="164" y="159" width="64" height="64" rx="3" fill="#f26767"/>
    <rect x="528" y="307" width="64" height="64" rx="3" fill="#f3ac48"/>
    <rect x="892" y="216" width="64" height="64" rx="3" fill="#44c997" stroke="#adffcf" stroke-width="3"/>
    <path d="M560 166 V245 m-8 -10 8 10 8 -10" fill="none" stroke="#f3ac48" stroke-width="4"/>
    <path d="M924 150 V196 m-8 -10 8 10 8 -10" fill="none" stroke="#44c997" stroke-width="4"/>
    <g font-size="17"><text x="48" y="145">그려지지만 중력에 반응하지 않음</text><text x="412" y="145">떨어지지만 충돌 영역이 없음</text><text x="776" y="145">떨어지고 바닥과 접촉함</text><text x="48" y="332">공중에 머무름</text><text x="776" y="332">바닥 위에 멈춤</text></g>
    <text x="412" y="390" font-size="15">바닥을 통과함</text>
    <text x="32" y="418" font-size="15" fill="#aebed6">회색 바닥에는 Collider가 적용되어 있습니다. 바닥은 고정 물체이므로 Rigid Body를 추가하지 않았습니다.</text>
  </g>
</svg>
